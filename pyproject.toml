[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "caissa2"
version = "2.0.0"
description = "Caïssa-2 (OCTAVE) — a free latent trunk with a concept head, PUCT search over the field, self-play distillation and memory as geometry."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Caïssa-2 construction agent" }]
keywords = ["chess", "concepts", "puct", "self-play", "interpretability"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "python-chess>=1.999",
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
caissa2-octave = "caissa2.eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
markers = [
  "slow: long-running tests",
]
